services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jiuyue
      POSTGRES_PASSWORD: jiuyue_dev
      POSTGRES_DB: jiuyue_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiuyue -d jiuyue_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
