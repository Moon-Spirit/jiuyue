# PostgreSQL 16 logging for the single 2 GB box — volume bound + rotation owner.
#
# Installed by deploy/provision.sh to
#   /etc/postgresql/16/main/conf.d/30-jiuyue-logging.conf
# (Debian/Ubuntu include conf.d/*.conf from postgresql.conf). Loaded AFTER
# 20-jiuyue-tuning.conf, which already sets the verbosity knobs
# (log_min_duration_statement, log_checkpoints, log_autovacuum_min_duration).
#
# HOW POSTGRESQL LOGS ON DEBIAN (this is why there is no log_rotation_* here)
# --------------------------------------------------------------------------
# Debian does NOT enable PostgreSQL's own log collector. `pg_ctlcluster` starts
# the postmaster with `pg_ctl -l /var/log/postgresql/postgresql-<ver>-<cluster>.log`,
# i.e. stderr is redirected to a plain append-mode file, and the upstream
# `logging_collector` default (off) applies. Consequence: PostgreSQL's own
# `log_rotation_size` / `log_rotation_age` / `log_truncate_on_rotation` have NO
# effect here — they only act when `logging_collector = on`. Rotation is
# therefore done by logrotate, which is also why the tunables below are about
# VOLUME (how much there is to rotate), not about file size.
#
# Rotation is owned by this repository: /etc/logrotate.d/jiuyue-postgresql
# (installed from deploy/logrotate/jiuyue-postgresql) caps the file at 50 MB with
# 5 compressed generations. `provision.sh` moves Debian's own
# /etc/logrotate.d/postgresql-common aside so the two cannot conflict over the
# same path (logrotate errors on a duplicate log entry). See docs/monitoring.md §4.
#
# If someone later enables `logging_collector = on`, PostgreSQL would write its
# OWN files under the data directory (default log_directory 'log') with
# accumulating timestamped names — do NOT do that without also giving those files
# an operator-owned rotation policy. It is deliberately off:

logging_collector = off
log_destination = 'stderr'

# --- volume bound: the cheap half of "the log cannot grow without a bound" ---
# Never log full statements (the single biggest way to fill a disk).
log_statement = 'none'
# Only statement text for statements that error; not for every slow one.
log_min_error_statement = 'error'
# Slow-query logging from 20-jiuyue-tuning.conf is restated so a reader sees the
# whole log-volume policy in one place.
log_min_duration_statement = 500ms

# Timestamp, pid and user/database on every line (Debian's default format, stated
# here so the runbook's grep examples are stable).
log_line_prefix = '%m [%p] %q%u@%d '
