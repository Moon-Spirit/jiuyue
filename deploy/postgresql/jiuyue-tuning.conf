# jiuyue PostgreSQL 16 tuning for a shared 2 vCPU / 2 GB box.
#
# Installed by deploy/provision.sh to
#   /etc/postgresql/16/main/conf.d/20-jiuyue-tuning.conf
# (Debian/Ubuntu include conf.d/*.conf from postgresql.conf), then PostgreSQL is
# restarted. Values are the "shared, cgroup-limited" starting point from
# docs/research/2026-09-16-vps-2gb-ops-research.md section (a) — deliberately
# below the dedicated-server 25%-of-RAM answer, because PostgreSQL is sharing
# the box with the app, Caddy and the OS.
#
# Measure before and after changing anything: `SELECT * FROM pg_stat_statements`
# plus PgBouncer-free sqlx pool metrics (the app caps its pool at 8).

# --- memory ----------------------------------------------------------------
shared_buffers = 384MB          # ~19% of host RAM; OS page cache caches the same pages
effective_cache_size = 1GB      # planner hint only; allocates nothing
work_mem = 4MB                  # per sort/hash node and per parallel worker, not per query
maintenance_work_mem = 64MB     # VACUUM / CREATE INDEX
wal_buffers = -1                # auto

# --- connections -----------------------------------------------------------
max_connections = 40            # the default 100 sizes arrays for the full ceiling
superuser_reserved_connections = 3
idle_in_transaction_session_timeout = '60s'
statement_timeout = '30s'

# --- I/O / checkpoints -----------------------------------------------------
random_page_cost = 1.1          # SSD/NVMe
effective_io_concurrency = 200
maintenance_io_concurrency = 200
checkpoint_completion_target = 0.9
min_wal_size = 256MB
max_wal_size = 1GB              # smaller than the dedicated-server default; small disk
wal_compression = on

# --- parallelism: two vCPUs, shared with the app ---------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 1

# --- huge pages / logging --------------------------------------------------
huge_pages = off
log_min_duration_statement = 500ms
log_checkpoints = on
log_autovacuum_min_duration = 10s

# --- autovacuum: never disable, never over-staff ---------------------------
# Each worker gets its own maintenance_work_mem, so raising the worker count
# multiplies memory. Tune high-churn tables (messages, sessions, presence,
# tokens) per table instead of tightening globally.
autovacuum_max_workers = 2
autovacuum_vacuum_cost_limit = 200
autovacuum_vacuum_cost_delay = 2ms
autovacuum_analyze_scale_factor = 0.05
