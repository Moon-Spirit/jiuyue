# journald limits for the single 2 GB box.
#
# Installed by deploy/provision.sh to
#   /etc/systemd/journald.conf.d/10-jiuyue-limits.conf
# then `systemctl restart systemd-journald`.
#
# WHY THIS FILE EXISTS
# --------------------
# With no containers (ADR-0010) the backend logs to journald
# (`StandardOutput=journal` in deploy/systemd/jiuyue.service) and Caddy's access
# log goes to journald too (`log { output stderr }` in deploy/Caddyfile). journald
# is therefore the single log sink for the whole application tier, and its own
# limits ARE the log-rotation mechanism: nothing else may grow without a bound.
#
# THE ARITHMETIC (see docs/monitoring.md for the full budget)
# -----------------------------------------------------------
#   SystemMaxFileSize 20M x SystemMaxFiles 10  ->  200M  (== SystemMaxUse)
#   RuntimeMaxUse     64M (tmpfs, /run — lost on reboot, deliberately small)
#   SystemKeepFree     1G (never let the journal push / below 1 GB free)
#   MaxRetentionSec    2week (hard age cap even if 200M is not reached)
#
# Journald caps the *whole* journal, not per-service: 200 MB total covers the
# backend, Caddy, sshd, systemd and the monitor. At the cap journald removes the
# OLDEST archived journal files first (vacuum), so `/` usage stays flat forever
# and the newest events survive. The unit files are configured so this file is
# the only place these knobs are set.
#
# Also see deploy/postgresql/jiuyue-logging.conf, which bounds PostgreSQL's own
# file log — journald does not capture it on Debian.

[Journal]
# Persistent storage under /var/log/journal so history survives a reboot.
# `Storage=persistent` forces persistent even if the directory has to be created.
Storage=persistent
Compress=yes

# Total on-disk budget for /var/log/journal (and the cap that keeps / stable).
SystemMaxUse=200M
# Individual file size and count; 20M x 10 keeps the total at the same 200M.
SystemMaxFileSize=20M
SystemMaxFiles=10

# Volatile journal lives on tmpfs (/run); keep it small so a log burst cannot
# eat RAM on a 2 GB box.
RuntimeMaxUse=64M

# Never let the journal consume the last 1 GB of the filesystem.
SystemKeepFree=1G

# Hard age cap: archive files older than two weeks are removed even if the size
# budget has not been reached.
MaxRetentionSec=2week
