# Caddy deployment inputs for the parameterised Caddyfile.
#
# Installed by deploy/provision.sh to
#   /etc/systemd/system/caddy.service.d/10-jiuyue-env.conf
# and the values to /etc/jiuyue/caddy.env (0640 root:caddy). A drop-in is used
# so the repo Caddyfile stays parameterised (no domain baked into git) while
# Caddy still sees the variables at runtime.
#
# The official Caddy systemd unit may define its own EnvironmentFile; systemd
# allows several, and later files win.
[Service]
EnvironmentFile=/etc/jiuyue/caddy.env
# Resource cap: Caddy's typical RSS is 15-35 MB; 128M leaves headroom for zstd
# compression while still localising an OOM to Caddy's own cgroup. See the
# memory budget in docs/deploy.md.
MemoryAccounting=yes
MemoryHigh=80M
MemoryMax=128M
