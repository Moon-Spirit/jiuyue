# PostgreSQL 16 memory cap for the shared 2 GB box.
#
# Installed by deploy/provision.sh to
#   /etc/systemd/system/postgresql@16-main.service.d/10-memory.conf
# then `systemctl daemon-reload`.
#
# A per-service cap localizes an OOM to PostgreSQL's own cgroup instead of
# letting the kernel pick a victim by size across the whole machine
# (docs/research/2026-09-16-vps-2gb-ops-research.md, section (c)). The cap is
# generous relative to the tuned working set (shared_buffers 384MB + a small
# connection pool), so it only bites on a genuine runaway.
[Service]
MemoryAccounting=yes
MemoryHigh=640M
MemoryMax=768M
# Strong but not immune OOM protection: sshd should always die last.
OOMScoreAdjust=-500
