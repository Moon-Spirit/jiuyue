[workspace]
resolver = "2"
members = ["crates/domain", "crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
authors = ["JiuYue Dev <dev@jiuyue.local>"]

[workspace.dependencies]
jiuyue-domain = { path = "crates/domain" }
jiuyue-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v7", "serde"] }

[profile.dev]
debug = 1
