[workspace]
resolver = "2"
members = ["crates/crypto", "crates/domain", "crates/protocol", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
authors = ["JiuYue Dev <dev@jiuyue.local>"]

[workspace.dependencies]
jiuyue-domain = { path = "crates/domain" }
jiuyue-protocol = { path = "crates/protocol" }
anyhow = "1"
argon2 = "0.5"
aes-gcm = { version = "0.10", features = ["std"] }
dashmap = "6"
jsonwebtoken = "9"
rand = "0.9"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "migrate"] }
thiserror = "2"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors", "fs"] }
uuid = { version = "1", features = ["v7", "serde"] }
vodozemac = "0.10"

[profile.dev]
debug = 1
