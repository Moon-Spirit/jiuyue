name: 功能请求
description: 提出一个新功能或改进建议
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题？
      placeholder: 例如：希望能给消息加标签分组…
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      placeholder: 描述你设想的交互或行为
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 补充
    validations:
      required: false
