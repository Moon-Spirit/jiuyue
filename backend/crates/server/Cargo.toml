[package]
name = "jiuyue-server"
description = "jiuyue realtime messaging backend server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Library + thin binary: integration tests build the router in-process instead
# of spawning the binary and binding a real socket.
[lib]
name = "jiuyue_server"
path = "src/lib.rs"

[[bin]]
name = "jiuyue-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dotenvy.workspace = true
jiuyue-auth = { path = "../auth" }
jiuyue-contract = { path = "../contract" }
jiuyue-realtime = { path = "../realtime" }
jiuyue-store = { path = "../store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Only exercised by the integration tests, so these live here rather than in the
# shipped dependency set. `tower` drives the in-process router; the WebSocket
# tests bind a real socket and connect a real client; `sqlx` inspects stored rows
# directly (the auth tests assert on the stored password hash, not on a mock).
[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
# Used to forge expired / foreign-signed tokens for the rejection tests.
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
sqlx = { version = "0.8", default-features = false, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "time",
] }
tokio-tungstenite = "0.29"
tower.workspace = true
