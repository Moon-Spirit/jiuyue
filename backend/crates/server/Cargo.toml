[package]
name = "jiuyue-server"
description = "jiuyue realtime messaging backend server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Library + thin binary: integration tests build the router in-process instead
# of spawning the binary and binding a real socket.
[lib]
name = "jiuyue_server"
path = "src/lib.rs"

[[bin]]
name = "jiuyue-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dotenvy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Only exercised by the integration tests (`tower::ServiceExt::oneshot`), so it
# lives here rather than in the shipped dependency set.
[dev-dependencies]
tower.workspace = true
