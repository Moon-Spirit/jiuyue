[package]
name = "jiuyue-server"
description = "jiuyue realtime messaging backend server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Library + thin binary: integration tests build the router in-process instead
# of spawning the binary and binding a real socket.
[lib]
name = "jiuyue_server"
path = "src/lib.rs"

[[bin]]
name = "jiuyue-server"
path = "src/main.rs"

[dependencies]
axum.workspace = true
dotenvy.workspace = true
jiuyue-realtime = { path = "../realtime" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Only exercised by the integration tests, so these live here rather than in the
# shipped dependency set. `tower` drives the in-process router; the WebSocket
# tests bind a real socket and connect a real client. `jiuyue-contract` is
# already a transitive dependency of the server; it is direct only so the tests
# can assert the envelope shape.
[dev-dependencies]
futures-util = { version = "0.3", features = ["sink"] }
jiuyue-contract = { path = "../contract" }
tokio-tungstenite = "0.29"
tower.workspace = true
